<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6366F1">
<title>משימות הבית</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%236366F1'/><text x='90' y='125' font-size='100' text-anchor='middle'>🏠</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3F0EB; --card: #FFFFFF; --text: #1A1A2E; --text2: #6B7280;
  --accent: #6366F1; --accent2: #818CF8; --accent3: #A78BFA;
  --border: #E5E7EB; --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow2: 0 4px 16px rgba(0,0,0,0.1);
  --red: #EF4444; --orange: #F59E0B; --green: #10B981; --purple: #7C3AED;
  --done-bg: #F9FAFB; --tag-gray-bg: #F3F4F6; --overlay: rgba(0,0,0,0.4);
  --section-recurring: linear-gradient(135deg, #6366F1, #818CF8);
  --section-onetime: linear-gradient(135deg, #EC4899, #F472B6);
  --section-open: linear-gradient(135deg, #3B82F6, #60A5FA);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F172A; --card: #1E293B; --text: #F1F5F9; --text2: #94A3B8;
    --border: #334155; --shadow: 0 2px 8px rgba(0,0,0,0.3);
    --shadow2: 0 4px 16px rgba(0,0,0,0.4);
    --done-bg: #1a2332; --tag-gray-bg: #334155; --overlay: rgba(0,0,0,0.6);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Rubik', sans-serif; background: var(--bg); color: var(--text);
  min-height: 100vh; min-height: 100dvh; max-width: 600px; margin: 0 auto; overflow-x: hidden;
  padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px));
}
button { font-family: 'Rubik', sans-serif; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: 'Rubik', sans-serif; color: var(--text); }

@keyframes slideIn { from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)} }
@keyframes slideUp { from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)} }
@keyframes popIn { 0%{transform:scale(0.85);opacity:0}100%{transform:scale(1);opacity:1} }
@keyframes fadeIn { from{opacity:0}to{opacity:1} }
@keyframes spin { to{transform:rotate(360deg)} }
@keyframes shake { 0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)} }
.slide-in{animation:slideIn .3s ease-out}.slide-up{animation:slideUp .3s ease-out}
.pop-in{animation:popIn .25s ease-out}.fade-in{animation:fadeIn .3s ease-out}
.shake{animation:shake .3s ease}

.screen{display:none}.screen.active{display:block}

/* Login */
.login-container{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:32px 24px;text-align:center}
.login-logo{font-size:64px;margin-bottom:16px}.login-title{font-size:28px;font-weight:700;margin-bottom:8px;color:var(--accent)}
.login-subtitle{font-size:15px;color:var(--text2);margin-bottom:40px;line-height:1.6}
.google-btn{display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;font-size:16px;font-weight:500;color:var(--text);box-shadow:var(--shadow2);transition:transform .15s}
.google-btn:active{transform:scale(.97)}.google-btn:disabled{opacity:.6;pointer-events:none}
.google-btn svg{width:22px;height:22px;flex-shrink:0}

/* Setup */
.setup-container{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:32px 24px;text-align:center}
.setup-card{background:var(--card);border-radius:20px;padding:28px 24px;width:100%;box-shadow:var(--shadow2);margin-bottom:16px}
.setup-card h3{font-size:18px;font-weight:600;margin-bottom:8px}.setup-card p{font-size:13px;color:var(--text2);margin-bottom:16px}
.setup-input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border);font-size:16px;background:var(--bg);outline:none;text-align:center}
.setup-input:focus{border-color:var(--accent)}
.setup-btn{width:100%;padding:14px;border-radius:14px;font-size:16px;font-weight:600;color:#fff;margin-top:12px;background:linear-gradient(135deg,var(--accent),var(--accent3))}
.setup-btn:disabled{opacity:.6;pointer-events:none}
.setup-divider{display:flex;align-items:center;gap:12px;margin:20px 0;font-size:13px;color:var(--text2)}
.setup-divider::before,.setup-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* Header */
.app-header{background:linear-gradient(135deg,#6366F1 0%,#818CF8 50%,#A78BFA 100%);padding:20px 20px 20px;color:#fff;position:relative}
@media(prefers-color-scheme:dark){.app-header{background:linear-gradient(135deg,#4F46E5 0%,#6366F1 50%,#818CF8 100%)}}
.header-row{display:flex;justify-content:space-between;align-items:center}
.header-info h1{font-size:20px;font-weight:700;letter-spacing:-.5px;margin-bottom:2px}
.header-info .sub{font-size:12px;opacity:.8}
.header-version{font-size:10px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:6px;margin-top:4px;display:inline-block}
.header-stats{text-align:left}.header-stats-num{font-size:28px;font-weight:700}.header-stats-label{font-size:11px;opacity:.8}

/* Members bar */
.members-bar{display:flex;align-items:center;gap:6px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.member-chip{display:flex;align-items:center;gap:5px;padding:3px 10px 3px 3px;background:var(--card);border-radius:20px;border:1.5px solid var(--border);flex-shrink:0;font-size:11px;font-weight:500;color:var(--text)}
.member-chip.me{border-color:var(--accent);background:#EEF2FF}
@media(prefers-color-scheme:dark){.member-chip.me{background:#312e81}}
.member-chip img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.member-chip .ap{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.member-invite-btn{width:30px;height:30px;border-radius:50%;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text2);flex-shrink:0}

/* Summary card */
.summary-card{margin:12px 16px;background:var(--card);border-radius:18px;padding:16px 20px;box-shadow:var(--shadow);display:flex;justify-content:space-around;text-align:center}
.summary-item .num{font-size:24px;font-weight:700}.summary-item .label{font-size:11px;color:var(--text2);margin-top:2px}

/* Section cards */
.section-card{margin:10px 16px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.section-header-btn{width:100%;padding:16px 20px;display:flex;align-items:center;gap:14px;background:var(--card);border-bottom:1px solid var(--border);transition:background .2s}
.section-header-btn:active{background:var(--bg)}
.section-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0}
.section-info{flex:1;text-align:right}.section-info h3{font-size:16px;font-weight:600;margin-bottom:2px}
.section-info p{font-size:12px;color:var(--text2)}
.section-count{background:var(--bg);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--text2)}
.section-arrow{font-size:14px;color:var(--text2);transition:transform .3s}
.section-arrow.open{transform:rotate(90deg)}
.section-body{background:var(--card);max-height:0;overflow:hidden;transition:max-height .4s ease}
.section-body.open{max-height:5000px}
.section-body-inner{padding:8px 12px 12px}

/* Today section — always open, special style */
.today-section{margin:10px 16px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.today-header{padding:16px 20px;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#FEF3C7,#FDE68A);border-bottom:1px solid #FDE68A}
@media(prefers-color-scheme:dark){.today-header{background:linear-gradient(135deg,#78350f,#92400e);border-color:#92400e}}
.today-header .icon{font-size:28px}.today-header h3{font-size:16px;font-weight:600;flex:1}
.today-header .count{font-size:13px;font-weight:700;color:var(--orange)}
.today-body{padding:8px 12px 12px}
.today-empty{text-align:center;padding:20px;color:var(--text2);font-size:13px}

/* Task card */
.task-card{background:var(--bg);border-radius:14px;padding:12px;margin-bottom:8px;position:relative;transition:transform .15s,opacity .2s}
.task-card:active{transform:scale(.98)}
.task-card.pending-delete{opacity:.4;transform:scale(.96)}
.task-row{display:flex;align-items:flex-start;gap:10px}
.task-check{width:28px;height:28px;border-radius:9px;border:2.5px solid #D1D5DB;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:1px;color:#fff;transition:all .2s}
.task-check.done{background:var(--green);border-color:var(--green)}.task-check.inprogress{background:#FEF3C7;border-color:var(--orange);color:var(--orange)}
.task-body{flex:1;min-width:0}
.task-name{font-size:14px;font-weight:500;line-height:1.4}.task-name.done{text-decoration:line-through;color:#9CA3AF}
.task-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:600;white-space:nowrap}
.tag-red{background:#FEF2F2;color:var(--red)}.tag-orange{background:#FFFBEB;color:var(--orange)}.tag-green{background:#ECFDF5;color:var(--green)}
.tag-gray{background:var(--tag-gray-bg);color:var(--text2)}.tag-blue{background:#EEF2FF;color:var(--accent)}.tag-purple{background:#F5F3FF;color:var(--purple)}
.tag-assigned{background:#DBEAFE;color:#2563EB;display:flex;align-items:center;gap:2px}.tag-assigned img{width:12px;height:12px;border-radius:50%}
.task-date{font-size:11px;color:#8B5CF6;margin-top:4px;display:flex;align-items:center;gap:4px}
.task-more{width:28px;height:28px;border-radius:8px;font-size:16px;color:#9CA3AF;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.task-actions{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.action-btn{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:500;color:var(--text);text-align:center}
.action-btn.danger{background:#FEF2F2;color:var(--red)}

/* Done section */
.done-task{background:var(--bg);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:10px;margin-bottom:6px;opacity:.6}
.done-check{width:22px;height:22px;border-radius:7px;background:var(--green);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:50;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 20px;border-radius:12px;font-size:10px;font-weight:500;color:var(--text2);transition:all .2s}
.nav-btn.active{color:var(--accent)}.nav-btn .icon{font-size:22px}
.nav-add{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(99,102,241,.3);margin-top:-20px}

/* Search */
.search-bar{padding:8px 16px;display:flex;gap:8px;align-items:center}
.search-input{flex:1;padding:10px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:14px;background:var(--card);outline:none}
.search-input:focus{border-color:var(--accent)}

/* Filters */
.filter-btn{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);font-size:16px;color:var(--text);display:flex;align-items:center;justify-content:center;position:relative}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-badge{position:absolute;top:-4px;left:-4px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.filters-panel{margin:8px 16px;background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow2)}
.filter-group{margin-bottom:10px}.filter-group:last-child{margin-bottom:0}
.filter-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
.filter-chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 10px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);font-size:11px;color:var(--text2)}
.chip.active{border:2px solid var(--accent);background:#EEF2FF;color:var(--accent);font-weight:600}
@media(prefers-color-scheme:dark){.chip.active{background:#312e81}}

/* Settings */
.settings-list{display:flex;flex-direction:column;gap:8px}
.settings-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
.settings-icon{font-size:22px;width:36px;text-align:center}.settings-info{flex:1}
.settings-label{font-size:14px;font-weight:500}.settings-desc{font-size:11px;color:var(--text2);margin-top:2px}
.settings-action{font-size:12px;color:var(--accent);font-weight:600;padding:6px 12px;border-radius:10px;background:#EEF2FF}
.settings-action.danger{color:var(--red);background:#FEF2F2}
.invite-code{font-size:32px;font-weight:700;letter-spacing:6px;color:var(--accent);background:#EEF2FF;border-radius:16px;padding:20px;text-align:center;margin-bottom:16px;font-family:'Rubik',monospace}
.invite-instructions{font-size:13px;color:var(--text2);text-align:center;line-height:1.6;margin-bottom:16px}
.copy-btn{width:100%;padding:12px;border-radius:14px;font-size:14px;font-weight:600;color:var(--accent);background:#EEF2FF;border:1.5px solid var(--accent)}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal-sheet{background:var(--bg);width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:20px 20px 32px;max-height:85vh;overflow-y:auto;touch-action:pan-y}
.modal-handle{width:40px;height:4px;border-radius:2px;background:#D1D5DB;margin:0 auto 16px}
.modal-title{font-size:18px;font-weight:600;margin-bottom:16px}
.modal-input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border);font-size:16px;background:var(--card);outline:none;margin-bottom:14px}
.modal-input:focus{border-color:var(--accent)}.modal-input.error{border-color:var(--red)}
.modal-input-error{font-size:12px;color:var(--red);margin:-10px 0 14px 4px;display:none}
.modal-label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px}
.modal-options{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.modal-option{padding:6px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);font-size:13px;color:var(--text)}
.modal-option.selected{border:2px solid var(--accent);background:#EEF2FF;font-weight:600}
@media(prefers-color-scheme:dark){.modal-option.selected{background:#312e81}}
.urgency-option{flex:1;padding:10px 0;border-radius:12px;text-align:center;font-size:13px;color:var(--text)}
.urgency-option.selected{font-weight:600}
.day-circle{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:center}
.day-circle.selected{border:2px solid var(--accent);background:var(--accent);color:#fff}
.select-all-days{font-size:11px;color:var(--accent);font-weight:600;margin-right:auto;padding:4px 8px}
.recurrence-option{padding:8px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);font-size:12px;color:var(--text)}
.recurrence-option.selected{border:2px solid #8B5CF6;background:#F5F3FF;color:var(--purple);font-weight:600}
.recurrence-hint{background:#F5F3FF;border:1px solid #DDD6FE;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--purple);display:flex;align-items:center;gap:8px}
.today-toggle{flex:1;padding:12px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500;color:var(--text)}
.today-toggle.active{background:#FEF3C7}
@media(prefers-color-scheme:dark){.today-toggle.active{background:#78350f}}
.assign-section{margin-bottom:14px}.assign-chips{display:flex;flex-wrap:wrap;gap:6px}
.assign-chip{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-size:13px;color:var(--text)}
.assign-chip.selected{border-color:#2563EB;background:#DBEAFE}
@media(prefers-color-scheme:dark){.assign-chip.selected{background:#1e3a5f}}
.assign-chip img{width:24px;height:24px;border-radius:50%}
.assign-chip .ap{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.modal-submit{width:100%;padding:14px 0;border-radius:14px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent3))}
.modal-submit:disabled{opacity:.6}

/* Confirm */
.confirm-dialog{position:fixed;inset:0;z-index:200;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:24px}
.confirm-box{background:var(--card);border-radius:20px;padding:24px;width:100%;max-width:320px;box-shadow:var(--shadow2);text-align:center}
.confirm-text{font-size:15px;font-weight:500;margin-bottom:20px;line-height:1.6}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:600}
.confirm-cancel{background:var(--done-bg);color:var(--text);border:1px solid var(--border)}.confirm-ok{background:var(--red);color:#fff}

/* Invites */
.invite-card{background:linear-gradient(135deg,#DBEAFE,#EEF2FF);border:1.5px solid #93C5FD;border-radius:14px;padding:12px 14px;margin-bottom:8px}
@media(prefers-color-scheme:dark){.invite-card{background:linear-gradient(135deg,#1e3a5f,#1e2940);border-color:#3B82F6}}
.invite-card-title{font-size:14px;font-weight:600}.invite-card-sub{font-size:12px;color:var(--text2)}
.invite-card-task{font-size:13px;font-weight:500;margin:8px 0;padding:8px 10px;background:var(--card);border-radius:10px}
.invite-btns{display:flex;gap:8px}
.invite-accept{flex:1;padding:10px;border-radius:12px;font-size:13px;font-weight:600;background:var(--green);color:#fff;text-align:center}
.invite-decline{flex:1;padding:10px;border-radius:12px;font-size:13px;font-weight:600;background:var(--done-bg);color:var(--text2);border:1px solid var(--border);text-align:center}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:500;z-index:200;box-shadow:var(--shadow2);max-width:90%;text-align:center;display:flex;align-items:center;gap:10px}
.toast-undo{color:#A78BFA;font-weight:700;padding:4px 8px;text-decoration:underline}

/* Misc */
.offline-banner{background:var(--orange);color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:500;display:none}
.offline-banner.show{display:block}
.empty{text-align:center;padding:24px 20px;color:var(--text2)}
.empty-icon{font-size:32px;margin-bottom:8px}.empty-text{font-size:14px;font-weight:500}.empty-sub{font-size:12px;margin-top:4px}
.spinner{width:24px;height:24px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
.spinner-dark{border-color:rgba(99,102,241,.2);border-top-color:var(--accent)}
.error-banner{margin:0 16px;padding:12px 16px;border-radius:12px;background:#FEF2F2;border:1px solid #FECACA;font-size:13px;color:var(--red);line-height:1.6}
</style>
</head>

const GCAL_API = 'https://www.googleapis.com/calendar/v3';

function recurrenceToRRule(rec) {
  switch(rec) {
    case 'daily': return 'RRULE:FREQ=DAILY';
    case 'every2days': return 'RRULE:FREQ=DAILY;INTERVAL=2';
    case 'every3days': return 'RRULE:FREQ=DAILY;INTERVAL=3';
    case 'weekly': return 'RRULE:FREQ=WEEKLY';
    case 'biweekly': return 'RRULE:FREQ=WEEKLY;INTERVAL=2';
    case 'monthly': return 'RRULE:FREQ=MONTHLY';
    default: return null;
  }
}

async function ensureCalendarToken() {
  if (calendarToken) return true;
  // Token missing or expired — re-auth with calendar scope
  try {
    const result = await signInWithPopup(auth, provider);
    const cred = GoogleAuthProvider.credentialFromResult(result);
    if (cred) { calendarToken = cred.accessToken; return true; }
  } catch(e) { console.error('Calendar re-auth failed:', e); }
  return false;
}

async function calendarFetch(path, method, body) {
  if (!await ensureCalendarToken()) { showToast('⚠️ לא ניתן להתחבר ליומן'); return null; }
  const opts = { method, headers: { 'Authorization': 'Bearer ' + calendarToken, 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(GCAL_API + path, opts);
  if (resp.status === 401) {
    // Token expired, retry once
    calendarToken = null;
    if (!await ensureCalendarToken()) return null;
    opts.headers['Authorization'] = 'Bearer ' + calendarToken;
    const retry = await fetch(GCAL_API + path, opts);
    if (!retry.ok) { console.error('Calendar API error:', await retry.text()); return null; }
    return retry.json().catch(() => ({}));
  }
  if (resp.status === 204) return {}; // DELETE returns 204
  if (!resp.ok) { console.error('Calendar API error:', resp.status, await resp.text()); return null; }
  return resp.json().catch(() => ({}));
}

function buildCalendarEvent(task) {
  const cat = catOf(task.category);
  const dateStr = task.nextDate || todayStr();
  const event = {
    summary: `${cat.icon} ${task.title}`,
    description: `משימת בית — ${cat.name} | ${URGENCY_META[task.urgency]?.label || 'רגיל'}`,
  };
  // Timed vs all-day
  if (task.calTimeType === 'timed' && task.calStartTime) {
    event.start = { dateTime: `${dateStr}T${task.calStartTime}:00`, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone };
    event.end = { dateTime: `${dateStr}T${task.calEndTime || task.calStartTime}:00`, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone };
  } else {
    event.start = { date: dateStr };
    event.end = { date: dateStr };
  }
  // Reminder
  const reminderMin = task.calReminder ?? 30;
  if (reminderMin > 0) {
    event.reminders = { useDefault: false, overrides: [{ method: 'popup', minutes: reminderMin }] };
  } else {
    event.reminders = { useDefault: false, overrides: [] };
  }
  // Recurrence
  const rrule = recurrenceToRRule(task.recurrence);
  if (rrule) event.recurrence = [rrule];
  return event;
}

async function createCalendarEvent(task) {
  const event = buildCalendarEvent(task);
  const result = await calendarFetch('/calendars/primary/events', 'POST', event);

      const data=userDoc.data();
      // Support both old (householdId) and new (householdIds) format
      const ids = data.householdIds || (data.householdId ? [data.householdId] : []);
      const activeId = data.activeHouseholdId || ids[0] || null;
      if(ids.length > 0 && activeId){
        // Migrate old format to new
        if(!data.householdIds){
          await updateDoc(doc(db,'users',currentUser.uid),{householdIds:ids, activeHouseholdId:activeId});
        }
        // Load household names for switcher
        userHouseholds = [];
        for(const hid of ids){
          try{
            const hSnap=await getDoc(doc(db,'households',hid));
            if(hSnap.exists()) userHouseholds.push({id:hid, name:hSnap.data().name||'משק בית'});
          }catch(e){/* household might have been deleted */}
        }
        householdId=activeId;
        startApp();
      } else {showScreen('setupScreen');}
    } else {showScreen('setupScreen');}
  }catch(e){showPersistentError('loginError','שגיאה בטעינת נתונים: '+e.message);}
}

// ===== HOUSEHOLD =====
async function addHouseholdToUser(hid){
  const userRef=doc(db,'users',currentUser.uid);
  const userSnap=await getDoc(userRef);
  const data=userSnap.exists()?userSnap.data():{};
  const ids = data.householdIds || (data.householdId ? [data.householdId] : []);
  if(!ids.includes(hid)) ids.push(hid);
  await setDoc(userRef,{householdIds:ids, activeHouseholdId:hid},{merge:true});
}

window.createHousehold = async () => {
  const name = document.getElementById('householdNameInput').value.trim();
  if(!name){showError('setupError','נא להזין שם');return;}
  const btn=document.getElementById('createHhBtn'); btn.disabled=true; btn.textContent='יוצר...';
  try{
    let code, exists=true, attempts=0;
    while(exists && attempts<10){
      code=generateCode(); attempts++;
      const q=query(collection(db,'households'),where('inviteCode','==',code));
      const snap=await getDocs(q); exists=!snap.empty;
    }
    const hRef=doc(collection(db,'households'));
    await setDoc(hRef,{name:esc(name),inviteCode:code,createdBy:currentUser.uid,createdAt:serverTimestamp(),
      members:[{uid:currentUser.uid,displayName:currentUser.displayName||'',photoURL:currentUser.photoURL||'',email:currentUser.email||''}]});
    await addHouseholdToUser(hRef.id);
    householdId=hRef.id;
    userHouseholds.push({id:hRef.id, name});
    startApp();
  }catch(e){showError('setupError','שגיאה: '+e.message);}
  finally{btn.disabled=false;btn.textContent='צור משק בית';}
};

window.joinHousehold = async () => {
  const code=document.getElementById('joinCodeInput').value.trim().toUpperCase();
  if(!code||code.length<4){showError('setupError','נא להזין קוד תקין');return;}
  const btn=document.getElementById('joinHhBtn'); btn.disabled=true; btn.textContent='מצטרף...';
  try{
    const q=query(collection(db,'households'),where('inviteCode','==',code));
    const snap=await getDocs(q);
    if(snap.empty){showError('setupError','קוד הזמנה לא נמצא');return;}
    const hDoc=snap.docs[0];
    const existing=hDoc.data().members||[];
    if(!existing.find(m=>m.uid===currentUser.uid)){
      await updateDoc(hDoc.ref,{members:arrayUnion({uid:currentUser.uid,displayName:currentUser.displayName||'',photoURL:currentUser.photoURL||'',email:currentUser.email||''})});
    }
    await addHouseholdToUser(hDoc.id);
    householdId=hDoc.id;
    if(!userHouseholds.find(h=>h.id===hDoc.id)) userHouseholds.push({id:hDoc.id, name:hDoc.data().name||'משק בית'});
    startApp();
  }catch(e){showError('setupError','שגיאה: '+e.message);}
  finally{btn.disabled=false;btn.textContent='הצטרף';}
};

window.switchHousehold = async (hid) => {
  if(hid===householdId) return;
  await updateDoc(doc(db,'users',currentUser.uid),{activeHouseholdId:hid});
  householdId=hid;
  if(unsubTasks)unsubTasks();if(unsubHousehold)unsubHousehold();

};

// ===== APP INIT =====
function startApp(){
  showScreen('appScreen');
  document.getElementById('headerDate').textContent=new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('headerVersion').textContent='v'+APP_VERSION;
  if(unsubHousehold)unsubHousehold();
  unsubHousehold=onSnapshot(doc(db,'households',householdId),snap=>{
    householdData=snap.data();
    document.getElementById('householdTitle').textContent='🏠 '+esc(householdData?.name||'משימות הבית');
    renderMembers();
    if(currentView==='settings')renderSettings();
  });
  if(unsubTasks)unsubTasks();
  unsubTasks=onSnapshot(collection(db,'households',householdId,'tasks'),snap=>{
    tasks=snap.docs.map(d=>({id:d.id,...d.data()}));
    updateCompletedToday();renderCurrentView();
  });
  renderFiltersPanel();
  // Auto-refresh FCM token if notifications already granted
  if (getNotificationStatus() === 'granted') {
    requestNotificationPermission(true).catch(()=>{});
  }
}
function updateCompletedToday(){
  const today=todayStr();
  const count=tasks.filter(t=>t.status==='done'&&t.completedAt&&t.completedAt.startsWith(today)).length;
  document.getElementById('completedToday').textContent=count;
}

window.setFilter=(k,v)=>{filters[k]=v;renderFiltersPanel();updateFilterBadge();renderList();};
window.applyFilters=()=>{filters.search=document.getElementById('searchInput').value;renderList();};
function updateFilterBadge(){
  const c=[filters.category!=='all',filters.urgency!=='all',filters.day!=='all',filters.recurrence!=='all',filters.assignedTo!=='all'].filter(Boolean).length;
  const btn=document.getElementById('filterToggle');
  btn.className='filter-btn'+(c>0?' active':'');
  btn.innerHTML=c>0?`⚙<span class="filter-badge">${c}</span>`:'⚙';
}
function getFiltered(){
  const s=filters.search.toLowerCase();
  return tasks.filter(t=>{
    if(filters.category!=='all'&&t.category!==filters.category)return false;
    if(filters.urgency!=='all'&&t.urgency!==filters.urgency)return false;
    if(filters.day!=='all'&&!(t.days||[]).includes(filters.day))return false;
    if(s&&!t.title.toLowerCase().includes(s))return false;
    if(filters.recurrence==='recurring'&&(!t.recurrence||t.recurrence==='none'))return false;
    if(filters.recurrence==='once'&&t.recurrence&&t.recurrence!=='none')return false;
    if(filters.assignedTo==='me'&&t.assignedTo!==currentUser.uid)return false;
    if(filters.assignedTo==='unassigned'&&t.assignedTo)return false;
    if(filters.assignedTo!=='all'&&filters.assignedTo!=='me'&&filters.assignedTo!=='unassigned'&&t.assignedTo!==filters.assignedTo)return false;
    return true;
  });
}



// ===== NEW RENDER: HOME VIEW =====
function renderHome(){
  const f = getFiltered();
  const todayT = f.filter(t => (t.isToday || (t.nextDate && t.nextDate === todayStr())) && t.status !== 'done');
  const recurringT = f.filter(t => t.recurrence && t.recurrence !== 'none' && t.status !== 'done' && !todayT.includes(t));
  const onetimeT = f.filter(t => (!t.recurrence || t.recurrence === 'none') && t.status !== 'done' && !todayT.includes(t));
  const doneT = f.filter(t => t.status === 'done');
  const allActive = f.filter(t => t.status !== 'done');

  // Summary card
  document.getElementById('summaryCard').innerHTML = `
    <div class="summary-item"><div class="num" style="color:var(--orange);">${todayT.length}</div><div class="label">להיום</div></div>
    <div class="summary-item"><div class="num" style="color:var(--accent);">${allActive.length}</div><div class="label">פעילות</div></div>
    <div class="summary-item"><div class="num" style="color:var(--green);">${doneT.length}</div><div class="label">הושלמו</div></div>
  `;

  let html = '';

  // TODAY section — always open
  html += `<div class="today-section slide-in">
    <div class="today-header"><span class="icon">📅</span><h3>מה יש היום?</h3><span class="count">${todayT.length}</span></div>
    <div class="today-body">${todayT.length ? todayT.map(renderTaskCard).join('') : '<div class="today-empty">🎉 אין כלום להיום</div>'}</div>
  </div>`;

  // RECURRING section
  html += renderCollapsibleSection('recurring', '🔄', 'חוזרות / מחזוריות', 'חוזרות לפי תדירות קבועה', recurringT, 'var(--section-recurring)');

  // ONE-TIME section
  html += renderCollapsibleSection('onetime', '📌', 'חד פעמיות', 'אירועים ומשימות לתאריך מסוים', onetimeT, 'var(--section-onetime)');

  // DONE section
  if (doneT.length) {
    html += renderCollapsibleSection('done', '✅', 'הושלמו', `${doneT.length} משימות`, doneT.slice(0, 20), 'linear-gradient(135deg, #10B981, #34D399)');
  }

  // Empty state
  if (!f.length) {
    html = `<div class="empty" style="padding:60px 20px;"><div class="empty-icon">🏡</div><div class="empty-text">אין משימות עדיין</div><div class="empty-sub">לחץ ＋ כדי להוסיף</div></div>`;
    document.getElementById('summaryCard').innerHTML = '';
  }

  document.getElementById('homeContent').innerHTML = html;
}

function renderCollapsibleSection(id, icon, title, subtitle, tasks, gradient) {
  const isOpen = window._openSections?.[id] || false;
  return `<div class="section-card">
    <button class="section-header-btn" onclick="toggleSection('${id}')">
      <div class="section-icon" style="background:${gradient};">${icon}</div>
      <div class="section-info"><h3>${title}</h3><p>${subtitle}</p></div>
      <span class="section-count">${tasks.length}</span>
      <span class="section-arrow${isOpen ? ' open' : ''}" id="arrow-${id}">◂</span>
    </button>
    <div class="section-body${isOpen ? ' open' : ''}" id="section-${id}">
      <div class="section-body-inner">${tasks.length ? tasks.map(t => id === 'done' ? renderDoneTask(t) : renderTaskCard(t)).join('') : '<div class="empty"><div class="empty-text">ריק</div></div>'}</div>
    </div>
  </div>`;
}

window._openSections = {};
window.toggleSection = (id) => {
  window._openSections[id] = !window._openSections[id];
  const body = document.getElementById('section-' + id);
  const arrow = document.getElementById('arrow-' + id);
  if (body) body.classList.toggle('open');
  if (arrow) arrow.classList.toggle('open');
};

function renderTaskCard(t) {
  const u = URGENCY_META[t.urgency] || URGENCY_META.low;
  const cat = catOf(t.category);
  const isRec = t.recurrence && t.recurrence !== 'none';
  const isPending = pendingDelete === t.id;
  const assignedName = t.assignedTo ? getMemberName(t.assignedTo) : '';
  const assignedPhoto = t.assignedTo ? getMemberPhoto(t.assignedTo) : '';
  return `<div class="task-card${isPending ? ' pending-delete' : ''} slide-in" id="task-${t.id}">
    <div class="task-row">
      <button class="task-check ${t.status}" onclick="toggleTask('${t.id}')">${t.status === 'done' ? '✓' : t.status === 'inprogress' ? '◐' : ''}</button>
      <div class="task-body">
        <div class="task-name ${t.status === 'done' ? 'done' : ''}">${esc(t.title)}</div>
        <div class="task-meta">
          <span class="tag tag-${u.color}">${u.label}</span>
          <span class="tag tag-gray">${cat.icon} ${cat.name}</span>
          ${(t.days || []).length ? `<span class="tag tag-blue">${t.days.map(d => DAYS.find(x => x.id === d)?.short).join(' ')}</span>` : ''}
          ${isRec ? `<span class="tag tag-purple">🔄 ${recLabel(t.recurrence)}</span>` : ''}
          ${assignedName ? `<span class="tag tag-assigned">${assignedPhoto ? `<img src="${escAttr(assignedPhoto)}" referrerpolicy="no-referrer">` : ''} ${esc(assignedName.split(' ')[0])}</span>` : ''}
          ${t.syncCalendar ? `<span class="tag" style="background:#DBEAFE;color:#2563EB;">📆${t.calendarInvites?.length ? (' ' + t.calendarInvites.map(inv => inv.status === 'pending' ? '⏳' : inv.status === 'accepted' ? '✓' : '✕').join('')) : ''}</span>` : ''}
        </div>
        ${(isRec || t.syncCalendar) && t.nextDate && t.status !== 'done' ? `<div class="task-date"><span>📅</span><span>${isRec ? 'הבא' : 'תאריך'}: ${formatNextDate(t.nextDate)}</span></div>` : ''}
      </div>
      <button class="task-more" onclick="toggleTaskActions('${t.id}')">⋮</button>
    </div>
    <div class="task-actions pop-in" id="actions-${t.id}" style="display:none;">
      <button class="action-btn" onclick="toggleTodayTask('${t.id}')">⭐ ${t.isToday ? 'הסר' : 'להיום'}</button>
      <button class="action-btn" onclick="openEditModal('${t.id}')">✏️ ערוך</button>
      <button class="action-btn danger" onclick="requestDeleteTask('${t.id}')">🗑️ מחק</button>
    </div>
  </div>`;
}

function renderDoneTask(t) {
  const cat = catOf(t.category);
  return `<div class="done-task"><button class="done-check" onclick="toggleTask('${t.id}')">✓</button><span style="flex:1;font-size:13px;text-decoration:line-through;color:#9CA3AF;">${esc(t.title)}</span><span style="font-size:11px;color:#D1D5DB;">${cat.icon}</span><button style="color:#D1D5DB;font-size:14px;" onclick="requestDeleteTask('${t.id}')">×</button></div>`;
}

window.acceptInvite = async (taskId) => {
  const t = tasks.find(x => x.id === taskId);
  if(!t) return;
  showToast('מוסיף ליומן...');
  try {
    // Ensure we have a calendar token
    if(!await ensureCalendarToken()){ showToast('⚠️ לא ניתן להתחבר ליומן'); return; }
    // Create event in MY calendar
    const eventId = await createCalendarEvent(t);
    // Update invite status in Firestore
    const invites = (t.calendarInvites||[]).map(inv =>
      inv.uid === currentUser.uid ? {...inv, status:'accepted', calendarEventId: eventId} : inv
    );
    await updateDoc(doc(db,'households',householdId,'tasks',taskId), {calendarInvites: invites});
    showToast('📆 נוסף ליומן שלך ✓');
  } catch(e) {
    console.error('Accept invite error:', e);
    showToast('⚠️ שגיאה: ' + e.message);
  }
};

window.declineInvite = async (taskId) => {
  const t = tasks.find(x => x.id === taskId);
  if(!t) return;
  try {
    const invites = (t.calendarInvites||[]).map(inv =>
      inv.uid === currentUser.uid ? {...inv, status:'declined'} : inv
    );
    await updateDoc(doc(db,'households',householdId,'tasks',taskId), {calendarInvites: invites});
    showToast('זימון נדחה');
  } catch(e) { showToast('שגיאה: ' + e.message); }
};

// ===== TASK ACTIONS =====
window.toggleTask = async id => {
  const t=tasks.find(x=>x.id===id); if(!t)return;
  const newStatus=t.status==='todo'?'inprogress':t.status==='inprogress'?'done':'todo';
  const ref=doc(db,'households',householdId,'tasks',id);
  try{
    if(newStatus==='done'&&t.recurrence&&t.recurrence!=='none'){
      await updateDoc(ref,{status:'done',completedAt:new Date().toISOString()});
      const nextDate=getNextDate(t.recurrence,t.nextDate||todayStr());
      const newT={...t,status:'todo',createdAt:new Date().toISOString(),nextDate,isToday:false,completedAt:null,calendarEventId:null};
      delete newT.id;
      // Create new calendar event for next occurrence if sync is on
      if(newT.syncCalendar){
        const eventId=await createCalendarEvent(newT).catch(()=>null);
        if(eventId) newT.calendarEventId=eventId;
      }
      await setDoc(doc(collection(db,'households',householdId,'tasks')),newT);
      showToast(`🔄 חוזרת — הבאה: ${formatNextDate(nextDate)}`);
    } else {
      await updateDoc(ref,{status:newStatus,...(newStatus==='done'?{completedAt:new Date().toISOString()}:{completedAt:null})});
    }
  }catch(e){showToast('שגיאה: '+e.message);}
};

// Delete with undo
let deleteTimer=null;
window.requestDeleteTask = id => {
  // Cancel any pending delete
  if(deleteTimer){clearTimeout(deleteTimer);if(pendingDelete)actuallyDelete(pendingDelete);}
  pendingDelete=id;
  renderCurrentView();
  showToastWithUndo('משימה תימחק בעוד 5 שניות',()=>{
    clearTimeout(deleteTimer);pendingDelete=null;renderCurrentView();showToast('בוטל ✓');
  });
  deleteTimer=setTimeout(()=>{actuallyDelete(id);pendingDelete=null;},5000);
};
async function actuallyDelete(id){
  try{
    const t=tasks.find(x=>x.id===id);
    if(t?.syncCalendar&&t?.calendarEventId) deleteCalendarEvent(t.calendarEventId).catch(()=>{});
    await deleteDoc(doc(db,'households',householdId,'tasks',id));
  }catch(e){}
}

// D&D with Firestore persistence
window.handleDragStart = id => { dragId=id; document.getElementById('task-'+id)?.classList.add('dragging'); };
window.handleDrop = async (e, targetId) => {
  e.preventDefault();
  if(!dragId||dragId===targetId){dragId=null;return;}
  const dragEl=document.getElementById('task-'+dragId);
  if(dragEl)dragEl.classList.remove('dragging');
  // Reorder in local array and persist
  const arr=[...tasks];
  const fromIdx=arr.findIndex(t=>t.id===dragId);
  const toIdx=arr.findIndex(t=>t.id===targetId);
  if(fromIdx===-1||toIdx===-1){dragId=null;return;}
  const [moved]=arr.splice(fromIdx,1);arr.splice(toIdx,0,moved);
  // Update order field in Firestore
  const batch = [];
  arr.forEach((t,i)=>{if(t.order!==i){batch.push(updateDoc(doc(db,'households',householdId,'tasks',t.id),{order:i}));}});
  tasks=arr.map((t,i)=>({...t,order:i}));
  renderCurrentView();
  dragId=null;
  try{await Promise.all(batch);}catch(e){console.error('Reorder error:',e);}
};

  const on=el.classList.contains('active');
  el.querySelector('span').textContent=on?'יומן ✓':'יומן Google';
  el.style.background=on?'#DBEAFE':'';el.style.borderColor=on?'#3B82F6':'';
  document.getElementById('mCalOptions').style.display=on?'block':'none';
  // Show date picker if calendar on, even without recurrence
  const recOn=document.querySelector('#mRec .selected')?.dataset.rec!=='none';
  document.getElementById('mStartDateWrap').style.display=(on||recOn)?'block':'none';
};
window.selectTimeType=el=>{
  el.parentElement.querySelectorAll('.modal-option').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');
  document.getElementById('mCalTimeInputs').style.display=el.dataset.tt==='timed'?'flex':'none';
};
window.selectReminder=el=>{
  el.parentElement.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));el.classList.add('active');
};

window.submitTask = async () => {
  const titleInput=document.getElementById('mTitle');
  const title=titleInput.value.trim();
  if(!title){titleInput.classList.add('error','shake');document.getElementById('mTitleError').style.display='block';setTimeout(()=>titleInput.classList.remove('shake'),300);return;}
  titleInput.classList.remove('error');document.getElementById('mTitleError').style.display='none';

  const btn=document.getElementById('mSubmit');btn.disabled=true;btn.textContent='שומר...';
  const category=document.querySelector('#mCats .selected')?.dataset.cat||'general';
  const urgency=document.querySelector('#mUrg .selected')?.dataset.urg||'low';
  const recurrence=document.querySelector('#mRec .selected')?.dataset.rec||'none';
  const days=[...document.querySelectorAll('#mDays .day-circle.selected')].map(b=>b.dataset.day);
  const isToday=document.getElementById('mToday').classList.contains('active');
  const assignedTo=document.querySelector('#mAssign .selected')?.dataset.uid||null;

  const startDate=document.getElementById('mStartDate')?.value||todayStr();
  const syncCalendar=document.getElementById('mSyncCal')?.classList.contains('active')||false;
  const calTimeType=document.querySelector('#mCalOptions .modal-option.selected')?.dataset.tt||'allday';
  const calStartTime=document.getElementById('mCalStart')?.value||'09:00';
  const calEndTime=document.getElementById('mCalEnd')?.value||'10:00';
  const calReminder=parseInt(document.querySelector('#mCalReminder .active')?.dataset.rem??'30');
  const data={title,category,urgency,recurrence,days,isToday,assignedTo:assignedTo||null,nextDate:(recurrence!=='none'||syncCalendar)?startDate:null,syncCalendar,calTimeType,calStartTime,calEndTime,calReminder};

  try{
    let taskRef;
    if(editingTask){
      taskRef = doc(db,'households',householdId,'tasks',editingTask.id);
      await updateDoc(taskRef, data);
      showToast('משימה עודכנה ✓');
    } else {
      data.status='todo';data.createdAt=new Date().toISOString();data.createdBy=currentUser.uid;
      data.createdByName=currentUser.displayName||'';data.completedAt=null;data.order=tasks.length;
      taskRef = doc(collection(db,'households',householdId,'tasks'));
      await setDoc(taskRef, data);
      showToast('משימה נוספה ✓');
    }
    closeModal();
    // Calendar sync AFTER task is saved (non-blocking)
    if(syncCalendar){
      try{
        let eventId = editingTask?.calendarEventId || null;
        if(eventId){
          await updateCalendarEvent(eventId, data);
        } else {
          eventId = await createCalendarEvent(data);
        }
        if(eventId) await updateDoc(taskRef, {calendarEventId: eventId}).catch(()=>{});
        showToast('📆 סונכרן עם יומן Google');
      }catch(calErr){ console.error('Calendar sync error:', calErr); showToast('⚠️ המשימה נשמרה, סנכרון יומן נכשל'); }
      // Send calendar invite to assigned user if different from creator
      const targetUid = data.assignedTo;
      if(targetUid && targetUid !== currentUser.uid){
        try{
          const existingInvites = editingTask?.calendarInvites || [];
          const alreadyInvited = existingInvites.some(inv => inv.uid === targetUid && inv.status !== 'declined');
          if(!alreadyInvited){
            const newInvites = existingInvites.filter(inv => inv.uid !== targetUid);
            newInvites.push({uid: targetUid, status: 'pending', calendarEventId: null});
            await updateDoc(taskRef, {calendarInvites: newInvites}).catch(()=>{});
            showToast('📬 זימון נשלח');
          }
        }catch(invErr){ console.error('Invite create error:', invErr); }
      }
    } else if(editingTask?.calendarEventId && !syncCalendar){
      deleteCalendarEvent(editingTask.calendarEventId).catch(()=>{});
      await updateDoc(taskRef, {calendarEventId: null}).catch(()=>{});
    }
  }catch(e){showToast('שגיאה: '+e.message);btn.disabled=false;btn.textContent=editingTask?'שמור שינויים':'הוסף משימה';}
};

// ===== INVITE MODAL =====
window.openInviteModal=()=>{
  if(!householdData)return;
  const overlay=document.getElementById('modalOverlay');overlay.style.display='flex';
  overlay.innerHTML=`<div class="modal-sheet slide-up">
    <div class="modal-handle"></div>
    <div class="modal-title" style="text-align:center;">🔗 הזמן חברים</div>
    <div class="invite-code">${esc(householdData.inviteCode)}</div>
    <div class="invite-instructions">שתף את הקוד עם בני המשפחה / שותפים.<br>הם ייכנסו לאפליקציה, ילחצו "הצטרף" ויזינו את הקוד.</div>
    <button class="copy-btn" onclick="copyInviteCode()">📋 העתק קוד</button>
    ${navigator.share?`<button class="modal-submit" style="margin-top:10px;" onclick="shareInvite()">📤 שתף</button>`:''}
  </div>`;
};
window.copyInviteCode=()=>{navigator.clipboard?.writeText(householdData.inviteCode);showToast('קוד הועתק ✓');};
window.shareInvite=()=>{navigator.share?.({title:'הצטרף למשימות הבית!',text:`הצטרף ל${householdData.name}!\nקוד: ${householdData.inviteCode}`}).catch(()=>{});};

// ===== UTILS =====
function closeModal(){document.getElementById('modalOverlay').style.display='none';}
window.closeModal=closeModal;

function showToast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=esc(msg);t.style.display='flex';
  clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.display='none',2500);
}
function showToastWithUndo(msg, onUndo){
  const t=document.getElementById('toast');
  t.innerHTML=`<span>${esc(msg)}</span><button class="toast-undo" id="undoBtn">↩ בטל</button>`;
  t.style.display='flex';
  document.getElementById('undoBtn').onclick=()=>{t.style.display='none';onUndo();};
  clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.display='none',5000);
}
function showError(elId,msg){
  const el=document.getElementById(elId); el.textContent=msg; el.style.display='';
  setTimeout(()=>el.style.display='none',5000);
}
function showPersistentError(elId,html){
  const el=document.getElementById(elId); el.innerHTML=html; el.style.display='';
  // Don't auto-hide
}

// ===== BACK BUTTON HANDLING =====
let backPressedOnce = false;
history.pushState({ page: 'app' }, '');
window.addEventListener('popstate', (e) => {
  // If a modal is open, close it
  const modal = document.getElementById('modalOverlay');
  const confirm = document.getElementById('confirmDialog');
  if (modal && modal.style.display !== 'none') {
    closeModal();
    history.pushState({ page: 'app' }, '');
    return;
  }
  if (confirm && confirm.style.display !== 'none') {
    closeConfirm();
    history.pushState({ page: 'app' }, '');
    return;
  }
  // Otherwise, double-back to exit
  if (backPressedOnce) {
    // Let the browser navigate away
    return;
  }
  backPressedOnce = true;
  history.pushState({ page: 'app' }, '');
  showToast('לחץ חזור שוב כדי לצאת');
  setTimeout(() => { backPressedOnce = false; }, 2000);
});

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
