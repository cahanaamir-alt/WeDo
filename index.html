<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6366F1">
<title>משימות הבית</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8F6F1; --card: #FFFFFF; --text: #1A1A2E; --text2: #6B7280;
  --accent: #6366F1; --accent2: #818CF8; --accent3: #A78BFA;
  --border: #E5E7EB; --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --shadow2: 0 4px 12px rgba(0,0,0,0.08);
  --red: #EF4444; --orange: #F59E0B; --green: #10B981; --purple: #7C3AED;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Rubik', sans-serif; background: var(--bg); color: var(--text);
  min-height: 100vh; max-width: 480px; margin: 0 auto; overflow-x: hidden;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
button { font-family: 'Rubik', sans-serif; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: 'Rubik', sans-serif; }

/* Animations */
@keyframes slideIn { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideUp { from { opacity:0; transform:translateY(100%); } to { opacity:1; transform:translateY(0); } }
@keyframes popIn { 0% { transform:scale(0.85); opacity:0; } 100% { transform:scale(1); opacity:1; } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes spin { to { transform: rotate(360deg); } }

.slide-in { animation: slideIn 0.3s ease-out; }
.slide-up { animation: slideUp 0.3s ease-out; }
.pop-in { animation: popIn 0.25s ease-out; }
.fade-in { animation: fadeIn 0.3s ease-out; }

/* Screens */
.screen { display: none; }
.screen.active { display: block; }

/* Login screen */
.login-container {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 32px 24px; text-align: center;
}
.login-logo { font-size: 64px; margin-bottom: 16px; }
.login-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: var(--accent); }
.login-subtitle { font-size: 15px; color: var(--text2); margin-bottom: 40px; line-height: 1.6; }
.google-btn {
  display: flex; align-items: center; gap: 12px; padding: 14px 28px;
  background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;
  font-size: 16px; font-weight: 500; box-shadow: var(--shadow2);
  transition: transform 0.15s ease;
}
.google-btn:active { transform: scale(0.97); }
.google-btn img { width: 22px; height: 22px; }

/* Household setup */
.setup-container {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 32px 24px; text-align: center;
}
.setup-card {
  background: var(--card); border-radius: 20px; padding: 28px 24px; width: 100%;
  box-shadow: var(--shadow2); margin-bottom: 16px;
}
.setup-card h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.setup-card p { font-size: 13px; color: var(--text2); margin-bottom: 16px; }
.setup-input {
  width: 100%; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--border);
  font-size: 16px; background: var(--bg); outline: none; text-align: center;
}
.setup-input:focus { border-color: var(--accent); }
.setup-btn {
  width: 100%; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 600;
  color: #fff; margin-top: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent3));
}
.setup-btn:active { opacity: 0.9; }
.setup-btn.secondary { background: var(--bg); color: var(--accent); border: 1.5px solid var(--accent); }
.setup-divider {
  display: flex; align-items: center; gap: 12px; margin: 20px 0;
  font-size: 13px; color: var(--text2);
}
.setup-divider::before, .setup-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* Header */
.app-header {
  background: linear-gradient(135deg, #6366F1 0%, #818CF8 50%, #A78BFA 100%);
  padding: 20px 20px 24px; border-radius: 0 0 24px 24px; color: #fff;
}
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
.header-date { font-size: 13px; opacity: 0.85; margin-top: 2px; }
.header-stats { text-align: left; }
.header-stats-num { font-size: 28px; font-weight: 700; }
.header-stats-label { font-size: 11px; opacity: 0.8; }
.header-nav { display: flex; gap: 8px; }
.header-nav button {
  flex: 1; padding: 8px 0; border-radius: 12px; font-size: 13px; font-weight: 500; color: #fff;
}
.header-nav button.active { background: rgba(255,255,255,0.25); }
.header-nav button:not(.active) { background: rgba(255,255,255,0.08); }

/* Members bar */
.members-bar {
  display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.member-avatar {
  width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent);
  object-fit: cover; flex-shrink: 0;
}
.member-avatar-placeholder {
  width: 36px; height: 36px; border-radius: 50%; background: var(--accent);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; flex-shrink: 0;
}
.member-invite-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 2px dashed var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--text2); flex-shrink: 0;
}

/* Search & filters */
.search-bar { padding: 12px 16px 0; display: flex; gap: 8px; align-items: center; }
.search-input {
  flex: 1; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--border);
  font-size: 14px; background: var(--card); outline: none;
}
.search-input:focus { border-color: var(--accent); }
.filter-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--border);
  background: var(--card); font-size: 18px;
  display: flex; align-items: center; justify-content: center; position: relative;
}
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.filter-badge {
  position: absolute; top: -4px; left: -4px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--red); color: #fff; font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.filters-panel {
  margin: 10px 16px 0; background: var(--card); border-radius: 14px;
  padding: 14px; box-shadow: var(--shadow2);
}
.filter-group { margin-bottom: 10px; }
.filter-group:last-child { margin-bottom: 0; }
.filter-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
.filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 5px 12px; border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--card); font-size: 12px; font-weight: 400; color: #374151;
}
.chip.active { border: 2px solid var(--accent); background: #EEF2FF; color: var(--accent); font-weight: 600; }

/* Task sections & cards */
.content { padding: 12px 16px 100px; }
.section { margin-bottom: 16px; }
.section-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 6px 4px;
}
.section-header.accent {
  padding: 10px 14px; background: linear-gradient(135deg, #FEF3C7, #FDE68A); border-radius: 14px;
}
.section-title { font-size: 15px; font-weight: 600; }
.section-count {
  background: #F3F4F6; border-radius: 8px; padding: 1px 8px; font-size: 12px;
  font-weight: 600; color: var(--text2);
}
.section-header.accent .section-count { background: rgba(0,0,0,0.08); }

.task-card {
  background: var(--card); border-radius: 14px; padding: 12px 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05); transition: transform 0.15s ease;
  margin-bottom: 8px;
}
.task-card:active { transform: scale(0.98); }
.task-card[draggable="true"] { cursor: grab; }
.task-card.dragging { opacity: 0.5; transform: scale(0.95); }
.task-card.border-red { border-right: 4px solid var(--red); }
.task-card.border-orange { border-right: 4px solid var(--orange); }
.task-card.border-green { border-right: 4px solid var(--green); }

.task-top { display: flex; align-items: flex-start; gap: 10px; }
.task-checkbox {
  width: 26px; height: 26px; border-radius: 8px; border: 2px solid #D1D5DB;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0; margin-top: 2px; color: #fff;
}
.task-checkbox.done { background: var(--green); border-color: var(--green); }
.task-checkbox.inprogress { background: #FEF3C7; border-color: var(--orange); color: var(--orange); }
.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 14px; font-weight: 500; }
.task-title.done { text-decoration: line-through; color: #9CA3AF; }
.task-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag {
  font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 600; white-space: nowrap;
}
.tag-red { background: #FEF2F2; color: var(--red); }
.tag-orange { background: #FFFBEB; color: var(--orange); }
.tag-green { background: #ECFDF5; color: var(--green); }
.tag-gray { background: #F3F4F6; color: var(--text2); }
.tag-blue { background: #EEF2FF; color: var(--accent); }
.tag-purple { background: #F5F3FF; color: var(--purple); }
.task-next-date { margin-top: 5px; font-size: 11px; color: #8B5CF6; display: flex; align-items: center; gap: 4px; }
.task-creator { margin-top: 4px; font-size: 10px; color: #C4B5FD; }
.task-actions-btn {
  width: 30px; height: 30px; border-radius: 8px; font-size: 16px; color: #9CA3AF; flex-shrink: 0;
}
.task-actions {
  display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #F3F4F6;
}
.action-btn {
  flex: 1; padding: 8px 0; border-radius: 10px; border: 1px solid #F3F4F6;
  background: #F9FAFB; font-size: 12px; font-weight: 500; color: #374151;
}
.action-btn.danger { background: #FEF2F2; color: var(--red); }

/* Kanban */
.kanban { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; }
.kanban-col {
  min-width: 260px; flex: 0 0 260px; background: var(--card); border-radius: 16px;
  padding: 12px; box-shadow: var(--shadow);
}
.kanban-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 4px; }
.kanban-title { font-size: 14px; font-weight: 600; }
.kanban-count { background: #F3F4F6; border-radius: 10px; padding: 2px 8px; font-size: 12px; font-weight: 600; color: var(--text2); }
.kanban-card {
  border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
  transition: transform 0.1s;
}
.kanban-card:active { transform: scale(0.97); }

/* Done section */
.done-toggle {
  display: flex; align-items: center; gap: 8px; padding: 8px 4px;
  font-size: 14px; font-weight: 500; color: #9CA3AF;
}
.done-task {
  background: #F9FAFB; border-radius: 12px; padding: 10px 14px;
  display: flex; align-items: center; gap: 10px; opacity: 0.7; margin-bottom: 6px;
}
.done-task-check {
  width: 24px; height: 24px; border-radius: 7px; background: var(--green);
  color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center;
}

/* FAB */
.fab {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  width: 60px; height: 60px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent3)); color: #fff;
  font-size: 28px; box-shadow: 0 4px 20px rgba(99,102,241,0.4);
  display: flex; align-items: center; justify-content: center; z-index: 50;
}

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
}
.modal-sheet {
  background: var(--bg); width: 100%; max-width: 480px; border-radius: 24px 24px 0 0;
  padding: 20px 20px 32px; max-height: 85vh; overflow-y: auto;
}
.modal-handle { width: 40px; height: 4px; border-radius: 2px; background: #D1D5DB; margin: 0 auto 16px; }
.modal-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.modal-input {
  width: 100%; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--border);
  font-size: 16px; background: var(--card); outline: none; margin-bottom: 14px;
}
.modal-input:focus { border-color: var(--accent); }
.modal-label { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
.modal-options { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.modal-option {
  padding: 6px 12px; border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--card); font-size: 13px;
}
.modal-option.selected { border: 2px solid var(--accent); background: #EEF2FF; font-weight: 600; }
.urgency-option { flex: 1; padding: 10px 0; border-radius: 12px; text-align: center; font-size: 13px; }
.urgency-option.selected { font-weight: 600; }
.day-circle {
  width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--border);
  background: var(--card); font-size: 14px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.day-circle.selected { border: 2px solid var(--accent); background: var(--accent); color: #fff; }
.recurrence-option {
  padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--card); font-size: 13px;
}
.recurrence-option.selected { border: 2px solid #8B5CF6; background: #F5F3FF; color: var(--purple); font-weight: 600; }
.recurrence-hint {
  background: #F5F3FF; border: 1px solid #DDD6FE; border-radius: 12px;
  padding: 10px 14px; margin-bottom: 14px; font-size: 13px; color: var(--purple);
  display: flex; align-items: center; gap: 8px;
}
.today-toggle {
  width: 100%; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--border);
  background: var(--card); font-size: 14px; display: flex; align-items: center; gap: 8px;
  font-weight: 500; margin-bottom: 18px;
}
.today-toggle.active { background: #FEF3C7; }
.modal-submit {
  width: 100%; padding: 14px 0; border-radius: 14px; font-size: 16px; font-weight: 600;
  color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent3));
}

/* Settings modal */
.settings-list { display: flex; flex-direction: column; gap: 10px; }
.settings-item {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  background: var(--card); border-radius: 14px; box-shadow: var(--shadow);
}
.settings-icon { font-size: 22px; width: 40px; text-align: center; }
.settings-info { flex: 1; }
.settings-label { font-size: 14px; font-weight: 500; }
.settings-desc { font-size: 12px; color: var(--text2); margin-top: 2px; }
.settings-action { font-size: 13px; color: var(--accent); font-weight: 600; padding: 6px 14px; border-radius: 10px; background: #EEF2FF; }
.settings-action.danger { color: var(--red); background: #FEF2F2; }

/* Invite modal */
.invite-code {
  font-size: 32px; font-weight: 700; letter-spacing: 6px; color: var(--accent);
  background: #EEF2FF; border-radius: 16px; padding: 20px; text-align: center;
  margin-bottom: 16px; font-family: monospace;
}
.invite-instructions { font-size: 13px; color: var(--text2); text-align: center; line-height: 1.6; margin-bottom: 16px; }
.copy-btn {
  width: 100%; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 600;
  color: var(--accent); background: #EEF2FF; border: 1.5px solid var(--accent);
}

/* Toast */
.toast {
  position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
  background: #1F2937; color: #fff; padding: 10px 20px; border-radius: 12px;
  font-size: 14px; font-weight: 500; z-index: 200; box-shadow: var(--shadow2);
  max-width: 90%; text-align: center;
}

/* Empty state */
.empty { text-align: center; padding: 60px 20px; color: var(--text2); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 16px; font-weight: 500; }
.empty-sub { font-size: 13px; margin-top: 4px; }

/* Spinner */
.spinner { width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
.spinner-dark { border-color: rgba(99,102,241,0.2); border-top-color: var(--accent); }
</style>
</head>
<body>

<!-- ======================== LOGIN SCREEN ======================== -->
<div id="loginScreen" class="screen active">
  <div class="login-container fade-in">
    <div class="login-logo">🏠</div>
    <div class="login-title">משימות הבית</div>
    <div class="login-subtitle">נהלו את משימות הבית יחד —<br>משפחה, שותפים, או צוות</div>
    <button class="google-btn" onclick="signInWithGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      <span>התחבר עם Google</span>
    </button>
    <div id="loginError" style="margin-top:16px; font-size:13px; color:var(--red); display:none;"></div>
  </div>
</div>

<!-- ======================== HOUSEHOLD SETUP ======================== -->
<div id="setupScreen" class="screen">
  <div class="setup-container fade-in">
    <div style="font-size:48px; margin-bottom:16px;">🏡</div>
    <div style="font-size:22px; font-weight:700; margin-bottom:8px;">ברוך הבא!</div>
    <div style="font-size:14px; color:var(--text2); margin-bottom:28px;">כדי להתחיל, צור משק בית חדש או הצטרף לקיים</div>

    <div class="setup-card">
      <h3>🏠 צור משק בית חדש</h3>
      <p>תן שם למשק הבית שלך ושתף את הקוד עם בני המשפחה</p>
      <input id="householdNameInput" class="setup-input" placeholder="למשל: משפחת כהן" maxlength="30">
      <button class="setup-btn" onclick="createHousehold()">צור משק בית</button>
    </div>

    <div class="setup-divider">או</div>

    <div class="setup-card">
      <h3>🔗 הצטרף למשק בית</h3>
      <p>קיבלת קוד הזמנה? הכנס אותו כאן</p>
      <input id="joinCodeInput" class="setup-input" placeholder="הכנס קוד הזמנה" maxlength="8" style="letter-spacing:4px; font-weight:700; text-transform:uppercase;">
      <button class="setup-btn" onclick="joinHousehold()">הצטרף</button>
    </div>

    <button style="margin-top:20px; font-size:13px; color:var(--text2); text-decoration:underline;" onclick="signOutUser()">
      התנתק
    </button>
    <div id="setupError" style="margin-top:12px; font-size:13px; color:var(--red); display:none;"></div>
  </div>
</div>

<!-- ======================== MAIN APP ======================== -->
<div id="appScreen" class="screen">

  <!-- Header -->
  <div class="app-header">
    <div class="header-top">
      <div>
        <div class="header-title" id="householdTitle">🏠 משימות הבית</div>
        <div class="header-date" id="headerDate"></div>
      </div>
      <div class="header-stats">
        <div class="header-stats-num" id="completedToday">0</div>
        <div class="header-stats-label">הושלמו היום</div>
      </div>
    </div>
    <div class="header-nav">
      <button class="active" data-view="list" onclick="switchView('list')">☰ רשימה</button>
      <button data-view="kanban" onclick="switchView('kanban')">▦ קנבן</button>
      <button data-view="settings" onclick="switchView('settings')">⚙</button>
    </div>
  </div>

  <!-- Members bar -->
  <div class="members-bar" id="membersBar"></div>

  <!-- Views -->
  <div id="listView">
    <div class="search-bar">
      <input class="search-input" id="searchInput" placeholder="🔍 חיפוש משימה..." oninput="applyFilters()">
      <button class="filter-btn" id="filterToggle" onclick="toggleFilters()">⚙</button>
    </div>
    <div id="filtersPanel" class="filters-panel slide-in" style="display:none;"></div>
    <div class="content" id="tasksList"></div>
  </div>

  <div id="kanbanView" style="display:none;">
    <div class="content" id="kanbanContent"></div>
  </div>

  <div id="settingsView" style="display:none;">
    <div class="content" id="settingsContent"></div>
  </div>

  <!-- FAB -->
  <button class="fab" id="fabBtn" onclick="openAddModal()">＋</button>
</div>

<!-- ======================== MODALS ======================== -->
<div id="modalOverlay" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeModal()"></div>

<!-- Toast -->
<div id="toast" class="toast pop-in" style="display:none;"></div>

<!-- ======================== FIREBASE ======================== -->
<script type="module">
// ---------- FIREBASE CONFIG ----------

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut }

const auth = getAuth(app);
const db = getFirestore(app);

// ---------- STATE ----------
let currentUser = null;
let householdId = null;
let householdData = null;
let tasks = [];
let unsubTasks = null;
let unsubHousehold = null;
let currentView = 'list';
let filters = { category: 'all', urgency: 'all', day: 'all', recurrence: 'all', search: '' };
let dragId = null;

// ---------- CONSTANTS ----------
const CATEGORIES = [
  { id:'kitchen', name:'מטבח', icon:'🍳' }, { id:'cleaning', name:'ניקיון', icon:'🧹' },
  { id:'garden', name:'גינה', icon:'🌿' }, { id:'shopping', name:'קניות', icon:'🛒' },
  { id:'laundry', name:'כביסה', icon:'👕' }, { id:'maintenance', name:'תחזוקה', icon:'🔧' },
  { id:'kids', name:'ילדים', icon:'🧒' }, { id:'pets', name:'חיות מחמד', icon:'🐾' },
  { id:'general', name:'כללי', icon:'📌' },
];
const DAYS = [
  { id:'sun', short:'א׳' }, { id:'mon', short:'ב׳' }, { id:'tue', short:'ג׳' },
  { id:'wed', short:'ד׳' }, { id:'thu', short:'ה׳' }, { id:'fri', short:'ו׳' }, { id:'sat', short:'ש׳' },
];
const URGENCY_META = {
  urgent: { label:'דחוף', color:'red' }, medium: { label:'בינוני', color:'orange' }, low: { label:'רגיל', color:'green' },
};
const RECURRENCE = [
  { id:'none', label:'ללא', icon:'—' }, { id:'daily', label:'כל יום', icon:'📅' },
  { id:'every2days', label:'כל יומיים', icon:'📅' }, { id:'every3days', label:'כל 3 ימים', icon:'📅' },
  { id:'weekly', label:'שבועי', icon:'🔄' }, { id:'biweekly', label:'דו-שבועי', icon:'🔄' },
  { id:'monthly', label:'חודשי', icon:'🗓️' },
];

const todayStr = () => new Date().toISOString().slice(0, 10);
const catOf = id => CATEGORIES.find(c => c.id === id) || CATEGORIES[8];
const recLabel = id => RECURRENCE.find(r => r.id === id)?.label || '';

function getNextDate(rec, from) {
  const d = from ? new Date(from) : new Date();
  switch (rec) {
    case 'daily': d.setDate(d.getDate()+1); break;
    case 'every2days': d.setDate(d.getDate()+2); break;
    case 'every3days': d.setDate(d.getDate()+3); break;
    case 'weekly': d.setDate(d.getDate()+7); break;
    case 'biweekly': d.setDate(d.getDate()+14); break;
    case 'monthly': d.setMonth(d.getMonth()+1); break;
    default: return null;
  }
  return d.toISOString().slice(0,10);
}

function formatNextDate(ds) {
  if (!ds) return '';
  const d = new Date(ds+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff === 0) return 'היום';
  if (diff === 1) return 'מחר';
  if (diff === 2) return 'מחרתיים';
  if (diff < 7 && diff > 0) return `בעוד ${diff} ימים`;
  return d.toLocaleDateString('he-IL', { day:'numeric', month:'short' });
}

function generateCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

// ---------- AUTH ----------
window.signInWithGoogle = async () => {
  try {
    // Try popup first, fall back to redirect on mobile
    await signInWithPopup(auth, provider);
  } catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user') {
      await signInWithRedirect(auth, provider);
    } else {
      showError('loginError', 'שגיאה בהתחברות: ' + e.message);
    }
  }
};

window.signOutUser = async () => {
  if (unsubTasks) unsubTasks();
  if (unsubHousehold) unsubHousehold();
  await signOut(auth);
  householdId = null; householdData = null; tasks = [];
  showScreen('loginScreen');
};

// Check redirect result
getRedirectResult(auth).catch(() => {});

onAuthStateChanged(auth, async user => {
  if (user) {
    currentUser = user;
    await checkHousehold();
  } else {
    currentUser = null;
    showScreen('loginScreen');
  }
});

async function checkHousehold() {
  const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
  if (userDoc.exists() && userDoc.data().householdId) {
    householdId = userDoc.data().householdId;
    startApp();
  } else {
    showScreen('setupScreen');
  }
}

// ---------- HOUSEHOLD MANAGEMENT ----------
window.createHousehold = async () => {
  const name = document.getElementById('householdNameInput').value.trim();
  if (!name) { showError('setupError', 'נא להזין שם למשק הבית'); return; }

  const code = generateCode();
  const hRef = doc(collection(db, 'households'));
  await setDoc(hRef, {
    name,
    inviteCode: code,
    createdBy: currentUser.uid,
    createdAt: serverTimestamp(),
    members: [{
      uid: currentUser.uid,
      displayName: currentUser.displayName || '',
      photoURL: currentUser.photoURL || '',
      email: currentUser.email || '',
    }],
  });
  await setDoc(doc(db, 'users', currentUser.uid), { householdId: hRef.id }, { merge: true });
  householdId = hRef.id;
  startApp();
};

window.joinHousehold = async () => {
  const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
  if (!code || code.length < 4) { showError('setupError', 'נא להזין קוד תקין'); return; }

  const q = query(collection(db, 'households'), where('inviteCode', '==', code));
  const snap = await getDocs(q);
  if (snap.empty) { showError('setupError', 'קוד הזמנה לא נמצא'); return; }

  const hDoc = snap.docs[0];
  await updateDoc(hDoc.ref, {
    members: arrayUnion({
      uid: currentUser.uid,
      displayName: currentUser.displayName || '',
      photoURL: currentUser.photoURL || '',
      email: currentUser.email || '',
    })
  });
  await setDoc(doc(db, 'users', currentUser.uid), { householdId: hDoc.id }, { merge: true });
  householdId = hDoc.id;
  startApp();
};

// ---------- APP INIT ----------
function startApp() {
  showScreen('appScreen');
  document.getElementById('headerDate').textContent =
    new Date().toLocaleDateString('he-IL', { weekday:'long', day:'numeric', month:'long' });

  // Listen to household
  if (unsubHousehold) unsubHousehold();
  unsubHousehold = onSnapshot(doc(db, 'households', householdId), snap => {
    householdData = snap.data();
    document.getElementById('householdTitle').textContent = '🏠 ' + (householdData?.name || 'משימות הבית');
    renderMembers();
    if (currentView === 'settings') renderSettings();
  });

  // Listen to tasks
  if (unsubTasks) unsubTasks();
  unsubTasks = onSnapshot(
    collection(db, 'households', householdId, 'tasks'),
    snap => {
      tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      updateCompletedToday();
      renderCurrentView();
    }
  );

  renderFiltersPanel();
}

function updateCompletedToday() {
  const today = todayStr();
  const count = tasks.filter(t => t.status === 'done' && t.completedAt && t.completedAt.startsWith(today)).length;
  document.getElementById('completedToday').textContent = count;
}

// ---------- SCREENS & VIEWS ----------
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

window.switchView = (v) => {
  currentView = v;
  document.querySelectorAll('.header-nav button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  document.getElementById('listView').style.display = v === 'list' ? '' : 'none';
  document.getElementById('kanbanView').style.display = v === 'kanban' ? '' : 'none';
  document.getElementById('settingsView').style.display = v === 'settings' ? '' : 'none';
  document.getElementById('fabBtn').style.display = v === 'settings' ? 'none' : '';
  renderCurrentView();
};

function renderCurrentView() {
  if (currentView === 'list') renderList();
  else if (currentView === 'kanban') renderKanban();
  else if (currentView === 'settings') renderSettings();
}

// ---------- MEMBERS ----------
function renderMembers() {
  const bar = document.getElementById('membersBar');
  if (!householdData?.members) { bar.innerHTML = ''; return; }
  bar.innerHTML = householdData.members.map(m => {
    if (m.photoURL) return `<img class="member-avatar" src="${m.photoURL}" title="${m.displayName}" referrerpolicy="no-referrer">`;
    const initial = (m.displayName || m.email || '?')[0];
    return `<div class="member-avatar-placeholder" title="${m.displayName}">${initial}</div>`;
  }).join('') + `<button class="member-invite-btn" onclick="openInviteModal()" title="הזמן חבר">＋</button>`;
}

      <div class="filter-label">קטגוריה</div>
      <div class="filter-chips">
        <button class="chip ${filters.category==='all'?'active':''}" onclick="setFilter('category','all')">הכל</button>
        ${CATEGORIES.map(c => `<button class="chip ${filters.category===c.id?'active':''}" onclick="setFilter('category','${c.id}')">${c.icon} ${c.name}</button>`).join('')}
      </div>
    </div>
    <div class="filter-group">
      <div class="filter-label">דחיפות</div>
      <div class="filter-chips">
        <button class="chip ${filters.urgency==='all'?'active':''}" onclick="setFilter('urgency','all')">הכל</button>
        ${Object.entries(URGENCY_META).map(([k,v]) => `<button class="chip ${filters.urgency===k?'active':''}" onclick="setFilter('urgency','${k}')">${v.label}</button>`).join('')}
      </div>
    </div>
    <div class="filter-group">
      <div class="filter-label">יום</div>
      <div class="filter-chips">
        <button class="chip ${filters.day==='all'?'active':''}" onclick="setFilter('day','all')">הכל</button>

      <div class="filter-label">תדירות</div>

        <button class="chip ${filters.recurrence==='all'?'active':''}" onclick="setFilter('recurrence','all')">הכל</button>
        <button class="chip ${filters.recurrence==='recurring'?'active':''}" onclick="setFilter('recurrence','recurring')">🔄 חוזרות</button>

      </div>

}

window.setFilter = (key, val) => { filters[key] = val; renderFiltersPanel(); updateFilterBadge(); renderList(); };
window.applyFilters = () => { filters.search = document.getElementById('searchInput').value; renderList(); };

function updateFilterBadge() {
  const count = [filters.category!=='all', filters.urgency!=='all', filters.day!=='all', filters.recurrence!=='all'].filter(Boolean).length;
  const btn = document.getElementById('filterToggle');
  btn.className = 'filter-btn' + (count > 0 ? ' active' : '');
  btn.innerHTML = count > 0 ? `⚙<span class="filter-badge">${count}</span>` : '⚙';
}

function getFiltered() {
  return tasks.filter(t => {
    if (filters.category !== 'all' && t.category !== filters.category) return false;
    if (filters.urgency !== 'all' && t.urgency !== filters.urgency) return false;
    if (filters.day !== 'all' && !(t.days||[]).includes(filters.day)) return false;
    if (filters.search && !t.title.includes(filters.search)) return false;
    if (filters.recurrence === 'recurring' && (!t.recurrence || t.recurrence === 'none')) return false;
    if (filters.recurrence === 'once' && t.recurrence && t.recurrence !== 'none') return false;
    return true;
  });
}

// ---------- RENDER LIST ----------
function renderList() {
  const f = getFiltered();
  const todayT = f.filter(t => t.isToday && t.status !== 'done');
  const urgentT = f.filter(t => t.urgency === 'urgent' && !t.isToday && t.status !== 'done');
  const activeT = f.filter(t => t.status !== 'done' && !t.isToday && t.urgency !== 'urgent');
  const doneT = f.filter(t => t.status === 'done');

  let html = '';
  if (todayT.length) html += renderSection('⭐ להיום', todayT, true);
  if (urgentT.length) html += renderSection('🔴 דחוף', urgentT);
  if (activeT.length) html += renderSection('📋 משימות', activeT);
  if (doneT.length) html += renderDoneSection(doneT);
  if (!f.length) html = `<div class="empty"><div class="empty-icon">🏡</div><div class="empty-text">אין משימות עדיין</div><div class="empty-sub">לחץ על ＋ כדי להוסיף</div></div>`;

  document.getElementById('tasksList').innerHTML = html;
}

function renderSection(title, tasks, accent = false) {
  return `<div class="section"><div class="section-header${accent?' accent':''}"><span class="section-title">${title}</span><span class="section-count">${tasks.length}</span></div>${tasks.map(renderTaskCard).join('')}</div>`;
}

function renderTaskCard(t) {
  const u = URGENCY_META[t.urgency] || URGENCY_META.low;
  const cat = catOf(t.category);
  const isRec = t.recurrence && t.recurrence !== 'none';
  const creatorName = t.createdByName || '';

  return `<div class="task-card slide-in border-${u.color}" draggable="true"
    ondragstart="handleDragStart('${t.id}')" ondragover="event.preventDefault()" ondrop="handleDrop('${t.id}')"
    id="task-${t.id}">
    <div class="task-top">
      <button class="task-checkbox ${t.status}" onclick="toggleTask('${t.id}')">${t.status==='done'?'✓':t.status==='inprogress'?'◐':''}</button>
      <div class="task-body">
        <div class="task-title ${t.status==='done'?'done':''}">${t.title}</div>
        <div class="task-tags">
          <span class="tag tag-${u.color}">${u.label}</span>
          <span class="tag tag-gray">${cat.icon} ${cat.name}</span>
          ${(t.days||[]).length ? `<span class="tag tag-blue">${t.days.map(d=>DAYS.find(x=>x.id===d)?.short).join(' ')}</span>` : ''}
          ${isRec ? `<span class="tag tag-purple">🔄 ${recLabel(t.recurrence)}</span>` : ''}
        </div>
        ${isRec && t.nextDate && t.status!=='done' ? `<div class="task-next-date"><span>📅</span><span>הבא: ${formatNextDate(t.nextDate)}</span></div>` : ''}
        ${creatorName ? `<div class="task-creator">נוסף ע"י ${creatorName}</div>` : ''}
      </div>
      <button class="task-actions-btn" onclick="toggleTaskActions('${t.id}')">⋮</button>
    </div>
    <div class="task-actions pop-in" id="actions-${t.id}" style="display:none;">
      <button class="action-btn" onclick="toggleTodayTask('${t.id}')">⭐ ${t.isToday?'הסר מהיום':'להיום'}</button>
      <button class="action-btn" onclick="openEditModal('${t.id}')">✏️ ערוך</button>
      <button class="action-btn danger" onclick="deleteTask('${t.id}')">🗑️ מחק</button>
    </div>
  </div>`;
}

function renderDoneSection(doneTasks) {
  return `<div class="section"><button class="done-toggle" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none'; this.querySelector('span').textContent=this.nextElementSibling.style.display==='none'?'◂':'▾'"><span>◂</span> הושלמו (${doneTasks.length})</button><div style="display:none;">${doneTasks.map(t => {
    const cat = catOf(t.category);
    return `<div class="done-task"><button class="done-task-check" onclick="toggleTask('${t.id}')">✓</button><span style="flex:1;font-size:13px;text-decoration:line-through;color:#9CA3AF;">${t.title}</span><span style="font-size:11px;color:#D1D5DB;">${cat.icon}</span><button style="color:#D1D5DB;font-size:14px;" onclick="deleteTask('${t.id}')">×</button></div>`;
  }).join('')}</div></div>`;
}

// ---------- RENDER KANBAN ----------
function renderKanban() {
  const f = getFiltered();
  const cols = {
    todo: { label:'לביצוע', items: f.filter(t => t.status==='todo') },
    inprogress: { label:'בתהליך', items: f.filter(t => t.status==='inprogress') },
    done: { label:'הושלם', items: f.filter(t => t.status==='done') },
  };
  document.getElementById('kanbanContent').innerHTML = `<div class="kanban">${Object.entries(cols).map(([k,col]) => `
    <div class="kanban-col">
      <div class="kanban-header"><span class="kanban-title">${col.label}</span><span class="kanban-count">${col.items.length}</span></div>
      ${col.items.map(t => {
        const u = URGENCY_META[t.urgency]||URGENCY_META.low;
        const cat = catOf(t.category);
        const isRec = t.recurrence && t.recurrence !== 'none';
        const bgColors = { red:'#FEF2F2', orange:'#FFFBEB', green:'#ECFDF5' };
        const borderColors = { red:'var(--red)', orange:'var(--orange)', green:'var(--green)' };
        return `<div class="kanban-card" style="background:${bgColors[u.color]};border-right:3px solid ${borderColors[u.color]};" onclick="toggleTask('${t.id}')">
          <div style="font-size:13px;font-weight:500;margin-bottom:6px;">${t.title}</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;">
            <span style="font-size:10px;padding:1px 6px;border-radius:5px;background:rgba(0,0,0,0.06);">${cat.icon} ${cat.name}</span>
            ${t.isToday?'<span style="font-size:10px;padding:1px 6px;border-radius:5px;background:#FEF3C7;">⭐</span>':''}
            ${isRec?`<span style="font-size:10px;padding:1px 6px;border-radius:5px;background:#F5F3FF;color:var(--purple);">🔄 ${recLabel(t.recurrence)}</span>`:''}
          </div>
        </div>`;
      }).join('')}
      ${col.items.length===0?'<div style="text-align:center;padding:20px;color:#D1D5DB;font-size:13px;">ריק</div>':''}
    </div>`).join('')}</div>`;
}

window.removeMember = async (uid) => {
  if (!confirm('להסיר חבר זה ממשק הבית?')) return;
  const member = householdData.members.find(m => m.uid === uid);
  if (member) {
    await updateDoc(doc(db, 'households', householdId), { members: arrayRemove(member) });
    await deleteDoc(doc(db, 'users', uid));
    showToast('חבר הוסר');
  }
};

window.leaveHousehold = async () => {
  if (!confirm('בטוח שברצונך לעזוב את משק הבית?')) return;
  const me = householdData.members.find(m => m.uid === currentUser.uid);
  if (me) await updateDoc(doc(db, 'households', householdId), { members: arrayRemove(me) });
  await deleteDoc(doc(db, 'users', currentUser.uid));
  householdId = null; householdData = null; tasks = [];
  if (unsubTasks) unsubTasks();
  if (unsubHousehold) unsubHousehold();
  showScreen('setupScreen');
};

// ---------- TASK ACTIONS ----------
window.toggleTask = async (id) => {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const newStatus = t.status==='todo' ? 'inprogress' : t.status==='inprogress' ? 'done' : 'todo';
  const ref = doc(db, 'households', householdId, 'tasks', id);

  if (newStatus === 'done' && t.recurrence && t.recurrence !== 'none') {
    // Mark done
    await updateDoc(ref, { status:'done', completedAt: new Date().toISOString() });
    // Create next recurrence
    const nextDate = getNextDate(t.recurrence, t.nextDate || todayStr());
    const newTask = { ...t, status:'todo', createdAt: new Date().toISOString(), nextDate, isToday:false, completedAt:null };
    delete newTask.id;
    const newRef = doc(collection(db, 'households', householdId, 'tasks'));
    await setDoc(newRef, newTask);
    showToast(`🔄 משימה חוזרת — הבאה: ${formatNextDate(nextDate)}`);
  } else {
    await updateDoc(ref, { status: newStatus, ...(newStatus==='done' ? { completedAt: new Date().toISOString() } : { completedAt: null }) });
  }
};

window.deleteTask = async (id) => {
  await deleteDoc(doc(db, 'households', householdId, 'tasks', id));
  showToast('משימה נמחקה');
};

window.toggleTodayTask = async (id) => {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  await updateDoc(doc(db, 'households', householdId, 'tasks', id), { isToday: !t.isToday });
};

window.toggleTaskActions = (id) => {
  const el = document.getElementById('actions-' + id);
  if (el) el.style.display = el.style.display === 'none' ? '' : 'none';
};

// Drag & drop
window.handleDragStart = (id) => { dragId = id; document.getElementById('task-'+id)?.classList.add('dragging'); };
window.handleDrop = (targetId) => {
  if (dragId) document.getElementById('task-'+dragId)?.classList.remove('dragging');
  dragId = null;
  // Visual reorder only (Firestore doesn't need order for now)
};

// ---------- ADD/EDIT MODAL ----------
let editingTask = null;

window.openAddModal = () => { editingTask = null; showTaskModal(); };
window.openEditModal = (id) => { editingTask = tasks.find(t => t.id === id) || null; showTaskModal(); };

function showTaskModal(data) {
  const t = editingTask || {};
  const overlay = document.getElementById('modalOverlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div class="modal-sheet slide-up">
    <div class="modal-handle"></div>
    <div class="modal-title">${editingTask ? 'עריכת משימה' : 'משימה חדשה'}</div>
    <input class="modal-input" id="mTitle" placeholder="מה צריך לעשות?" value="${t.title||''}" autofocus>

    <div class="modal-label">קטגוריה</div>
    <div class="modal-options" id="mCats">
      ${CATEGORIES.map(c => `<button class="modal-option${(t.category||'general')===c.id?' selected':''}" data-cat="${c.id}" onclick="selectCat(this)">${c.icon} ${c.name}</button>`).join('')}
    </div>

    <div class="modal-label">דחיפות</div>
    <div style="display:flex;gap:8px;margin-bottom:14px;" id="mUrg">
      ${Object.entries(URGENCY_META).map(([k,v]) => {
        const sel = (t.urgency||'low')===k;
        const colors = { red:{bg:'#FEF2F2',border:'#EF4444'}, orange:{bg:'#FFFBEB',border:'#F59E0B'}, green:{bg:'#ECFDF5',border:'#10B981'} };
        const c = colors[v.color];
        return `<button class="urgency-option${sel?' selected':''}" data-urg="${k}" onclick="selectUrg(this)"
          style="flex:1;border:${sel?'2px':'1.5px'} solid ${sel?c.border:'var(--border)'};background:${sel?c.bg:'var(--card)'};color:${sel?c.border:'var(--text)'};border-radius:12px;font-size:13px;padding:10px 0;">
          ${v.label}</button>`;
      }).join('')}
    </div>

    <div class="modal-label">🔄 תדירות חזרה</div>
    <div class="modal-options" id="mRec">
      ${RECURRENCE.map(r => `<button class="recurrence-option${(t.recurrence||'none')===r.id?' selected':''}" data-rec="${r.id}" onclick="selectRec(this)">${r.icon} ${r.label}</button>`).join('')}
    </div>
    <div id="mRecHint" class="recurrence-hint" style="display:${(t.recurrence && t.recurrence!=='none')?'flex':'none'};">
      <span>🔄</span><span>המשימה תחזור ${recLabel(t.recurrence||'none')} אחרי השלמה</span>
    </div>

    <div class="modal-label">ימים בשבוע</div>
    <div style="display:flex;gap:6px;margin-bottom:14px;" id="mDays">
      ${DAYS.map(d => `<button class="day-circle${(t.days||[]).includes(d.id)?' selected':''}" data-day="${d.id}" onclick="toggleDay(this)">${d.short}</button>`).join('')}
    </div>

    <button class="today-toggle${t.isToday?' active':''}" id="mToday" onclick="this.classList.toggle('active')">
      ⭐ ${t.isToday ? 'מסומן להיום' : 'סמן להיום'}
    </button>

    <button class="modal-submit" onclick="submitTask()">${editingTask ? 'שמור שינויים' : 'הוסף משימה'}</button>
  </div>`;
}

window.selectCat = (el) => { el.parentElement.querySelectorAll('.modal-option').forEach(b => b.classList.remove('selected')); el.classList.add('selected'); };
window.selectUrg = (el) => {
  el.parentElement.querySelectorAll('.urgency-option').forEach(b => { b.classList.remove('selected'); b.style.border='1.5px solid var(--border)'; b.style.background='var(--card)'; b.style.color='var(--text)'; });
  el.classList.add('selected');
  const colors = { urgent:{bg:'#FEF2F2',border:'#EF4444'}, medium:{bg:'#FFFBEB',border:'#F59E0B'}, low:{bg:'#ECFDF5',border:'#10B981'} };
  const c = colors[el.dataset.urg];
  el.style.border=`2px solid ${c.border}`; el.style.background=c.bg; el.style.color=c.border;
};
window.selectRec = (el) => {
  el.parentElement.querySelectorAll('.recurrence-option').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  const hint = document.getElementById('mRecHint');
  if (el.dataset.rec !== 'none') { hint.style.display='flex'; hint.querySelector('span:last-child').textContent = `המשימה תחזור ${recLabel(el.dataset.rec)} אחרי השלמה`; }
  else { hint.style.display='none'; }
};
window.toggleDay = (el) => { el.classList.toggle('selected'); };

window.submitTask = async () => {
  const title = document.getElementById('mTitle').value.trim();
  if (!title) return;
  const category = document.querySelector('#mCats .selected')?.dataset.cat || 'general';
  const urgency = document.querySelector('#mUrg .selected')?.dataset.urg || 'low';
  const recurrence = document.querySelector('#mRec .selected')?.dataset.rec || 'none';
  const days = [...document.querySelectorAll('#mDays .selected')].map(b => b.dataset.day);
  const isToday = document.getElementById('mToday').classList.contains('active');

  const data = { title, category, urgency, recurrence, days, isToday,
    nextDate: recurrence !== 'none' ? todayStr() : null,
  };

  if (editingTask) {
    await updateDoc(doc(db, 'households', householdId, 'tasks', editingTask.id), data);
    showToast('משימה עודכנה ✓');
  } else {
    data.status = 'todo';
    data.createdAt = new Date().toISOString();
    data.createdBy = currentUser.uid;
    data.createdByName = currentUser.displayName || '';
    data.completedAt = null;
    await setDoc(doc(collection(db, 'households', householdId, 'tasks')), data);
    showToast('משימה נוספה ✓');
  }
  closeModal();
};

// ---------- INVITE MODAL ----------
window.openInviteModal = () => {
  if (!householdData) return;
  const overlay = document.getElementById('modalOverlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div class="modal-sheet slide-up">
    <div class="modal-handle"></div>
    <div class="modal-title" style="text-align:center;">🔗 הזמן חברים למשק הבית</div>
    <div class="invite-code" id="inviteCodeDisplay">${householdData.inviteCode}</div>
    <div class="invite-instructions">שתף את הקוד הזה עם בני המשפחה או השותפים.<br>הם יכנסו לאפליקציה, ילחצו "הצטרף למשק בית" ויזינו את הקוד.</div>
    <button class="copy-btn" onclick="copyInviteCode()">📋 העתק קוד</button>
    ${navigator.share ? `<button class="modal-submit" style="margin-top:10px;" onclick="shareInvite()">📤 שתף</button>` : ''}
  </div>`;
};

window.copyInviteCode = () => {
  navigator.clipboard?.writeText(householdData.inviteCode);
  showToast('קוד הועתק ✓');
};

window.shareInvite = () => {
  navigator.share?.({
    title: 'הצטרף למשק הבית שלנו!',
    text: `הצטרף למשימות הבית של ${householdData.name}!\nקוד הזמנה: ${householdData.inviteCode}`,
  }).catch(() => {});
};

// ---------- UTILS ----------
function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
window.closeModal = closeModal;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = '';
  setTimeout(() => { t.style.display = 'none'; }, 2500);
}

function showError(elId, msg) {
  const el = document.getElementById(elId);
  el.textContent = msg; el.style.display = '';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
